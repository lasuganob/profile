<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leo Alexander Suganob | Portfolio</title>
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=chat" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="intro">
      <h1>Leo Alexander Suganob</h1>
      <p>Frontend-heavy full-stack developer focusing on modern, functional, and beautifully responsive web experiences.</p>
    </div>
    <div class="buttons">
      <button class="btn" onclick="openDialog('about')">About Me</button>
      <button class="btn" onclick="openDialog('skills')">Tech Skills</button>
      <button class="btn" onclick="openDialog('projects')">Featured Projects</button>
      <button class="btn" onclick="openDialog('contact')">Get in Touch</button>
    </div>
  </main>

  <!-- Dialog Overlay -->
  <div class="dialog-overlay" id="dialogOverlay" onclick="closeDialog(event)">
    <div class="dialog-content" id="dialogContent" onclick="event.stopPropagation()">
      <button class="dialog-close" onclick="closeDialog()" aria-label="Close dialog">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 1L1 13M1 1L13 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <h3 class="dialog-title" id="dTitle">Title</h3>
      <div class="dialog-body" id="dBody">Body content</div>
    </div>
  </div>

  <!-- Floating Chat Button -->
  <button class="chat-toggle-btn" id="chatToggleBtn" aria-label="Open Chat">
    <span class="material-symbols-outlined">
      chat
    </span>
  </button>

  <!-- Chat Area -->
  <aside class="chat-container" id="chatContainer">
    <header class="chat-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <h2><span class="status-dot"></span> Interactive Assistant</h2>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 0.85rem; color: var(--text-muted);">Online</span>
        <button class="chat-close-btn" id="chatCloseBtn" aria-label="Close Chat">
          <svg width="12" height="12" viewBox="0 0 14 14" fill="none" stroke="currentColor">
            <path d="M13 1L1 13M1 1L13 13" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </header>
    
    <div class="chat-messages" id="chatWindow">
      <!-- Messages inject here -->
    </div>

    <div class="chat-input-area">
      <input type="text" id="chatInput" placeholder="Ask about my skills, projects, or background..." autocomplete="off"/>
      <button id="sendBtn">Send</button>
    </div>
  </aside>

  <script type="module" src="script.js"></script>
</body>
</html>
